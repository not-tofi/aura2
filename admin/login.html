<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Aura Nails</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #fdf2f7, #f7d6de);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .login-box {
        width: min(420px, 92vw);
        background: #fff;
        border-radius: 18px;
        padding: 32px 24px;
        box-shadow: 0 16px 36px rgba(129, 71, 92, 0.18);
      }
      h1 {
        margin: 0 0 8px;
        color: #4d2a37;
        font-size: 2rem;
        text-align: center;
      }
      p {
        margin: 0 0 20px;
        text-align: center;
        color: #6c4f5d;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #4d2a37;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #e9cdd5;
        margin-bottom: 16px;
        font-size: 1rem;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 12px 16px;
        background: #d97ca2;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      .hint {
        margin-top: 14px;
        font-size: 0.9rem;
        color: #7a5a68;
      }
      #mensaje {
        margin-top: 14px;
        color: #8a2e54;
        min-height: 20px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h1>Aura Nails</h1>
      <p>Panel de administración</p>

      <form id="loginForm">
        <label for="usuario">Usuario</label>
        <input id="usuario" type="text" value="admin" required />

        <label for="password">Contraseña</label>
        <input id="password" type="password" value="admin123" required />

        <button type="submit">Ingresar</button>
      </form>

      <div id="mensaje"></div>
      <div class="hint">Demo: usuario = admin / contraseña = admin123</div>
    </div>

    <script>
      const loginForm = document.getElementById('loginForm');
      const mensaje = document.getElementById('mensaje');

      loginForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const usuario = document.getElementById('usuario').value.trim();
        const password = document.getElementById('password').value.trim();

        if (usuario === 'admin' && password === 'admin123') {
          localStorage.setItem('adminSession', 'true');
          window.location.href = '../index.html';
          return;
        }

        mensaje.textContent = 'Usuario o contraseña incorrectos.';
      });
    </script>
  </body>
</html>
