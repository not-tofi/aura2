<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7d6de" />
    <meta name="description" content="Ingreso al panel administrativo de Aura Nails." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aura Admin" />
    <link rel="manifest" href="../manifest.json" />
    <title>Admin - Aura Nails</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #fdf2f7, #f7d6de);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(12px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom));
      }
      .login-box {
        width: min(420px, 100%);
        background: #fff;
        border-radius: 18px;
        padding: 28px 18px;
        box-shadow: 0 16px 36px rgba(129, 71, 92, 0.18);
      }
      h1 {
        margin: 0 0 8px;
        color: #4d2a37;
        font-size: 2rem;
        text-align: center;
      }
      p {
        margin: 0 0 20px;
        text-align: center;
        color: #6c4f5d;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #4d2a37;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #e9cdd5;
        margin-bottom: 16px;
        font-size: 1rem;
        min-height: 44px;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 12px 16px;
        background: #d97ca2;
        color: white;
        font-weight: 700;
        cursor: pointer;
        min-height: 46px;
      }
      .hint {
        margin-top: 14px;
        font-size: 0.9rem;
        color: #7a5a68;
      }
      #mensaje {
        margin-top: 14px;
        color: #8a2e54;
        min-height: 20px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h1>Aura Nails</h1>
      <p>Panel de administración</p>

      <form id="loginForm">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" placeholder="admin@aura-nails.local" required />

        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="Tu contraseña" required />

        <button type="submit">Ingresar</button>
      </form>

      <div id="mensaje"></div>
      <div class="hint">Usá la cuenta administrativa creada en Supabase Auth.</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        const swUrl = window.location.hostname === 'localhost' ? '../sw.js' : '/aura2/sw.js';
        window.addEventListener('load', () => {
          navigator.serviceWorker.register(swUrl).catch(() => {});
        });
      }

      const loginForm = document.getElementById('loginForm');
      const mensaje = document.getElementById('mensaje');
      const ADMIN_EMAIL = (window.AURA_SUPABASE?.adminEmail || '').trim().toLowerCase();

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        mensaje.textContent = '';

        const client = window.auraSupabase;
        if (!client) {
          mensaje.textContent = 'Falta configurar Supabase en el proyecto.';
          return;
        }

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) {
          mensaje.textContent = 'Completá correo y contraseña.';
          return;
        }

        const { data, error } = await client.auth.signInWithPassword({ email, password });

        if (error) {
          mensaje.textContent = 'Credenciales inválidas o sin permisos de administrador.';
          return;
        }

        const user = data?.user;
        const isAdmin = !!user && (
          user.app_metadata?.role === 'admin' ||
          user.email?.toLowerCase() === ADMIN_EMAIL ||
          user.email?.toLowerCase().endsWith('@aura-nails.local')
        );

        if (!isAdmin) {
          await client.auth.signOut().catch(() => {});
          mensaje.textContent = 'Esta cuenta no tiene permisos de administrador.';
          return;
        }

        localStorage.setItem('adminSession', 'true');
        window.location.href = './index.html';
      });
    </script>
  </body>
</html>
