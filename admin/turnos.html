<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turnos - Admin</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #fdf2f7; }
      .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
      .sidebar { background: #4d2a37; color: white; padding: 20px; }
      .sidebar a { display: block; color: white; text-decoration: none; padding: 12px 10px; border-radius: 10px; margin: 8px 0; background: rgba(255,255,255,0.06); }
      .main { padding: 28px; }
      .panel { background: white; border-radius: 18px; padding: 22px; box-shadow: 0 12px 24px rgba(0,0,0,0.05); }
      .turno { border: 1px solid #f1d7e3; padding: 16px; border-radius: 12px; margin-top: 12px; }
      .estado { display: inline-block; padding: 6px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; }
      .pendiente { background: #ffe8bd; color: #8b5d00; }
      .confirmado { background: #dff7e8; color: #1a6b44; }
      .cancelado { background: #f7d6dc; color: #8a1f3d; }
      .botones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
      button { border: none; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h2>Aura Nails</h2>
        <a href="index.html">Inicio</a>
        <a href="turnos.html">Turnos</a>
        <a href="clientes.html">Clientes</a>
        <a href="tipos.html">Tipos</a>
        <a href="historial.html">Historial</a>
        <a href="login.html" id="logoutBtn">Cerrar sesión</a>
      </aside>

      <main class="main">
        <div class="panel">
          <h1>Turnos</h1>
          <div id="listaTurnos"></div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script>
      const adminLogged = localStorage.getItem('adminSession');
      if (adminLogged !== 'true') {
        window.location.href = 'login.html';
      }

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('adminSession');
      });

      async function cargarTurnos() {
        const client = window.auraSupabase;
        const cont = document.getElementById('listaTurnos');

        if (!client) {
          cont.innerHTML = '<p>Configura Supabase para ver los turnos.</p>';
          return;
        }

        const { data: turnos, error } = await client
          .from('turnos')
          .select('*, tipos (id, nombre)')
          .order('fecha', { ascending: true })
          .order('hora', { ascending: true });

        if (error) {
          cont.innerHTML = '<p>No se pudieron cargar los turnos.</p>';
          return;
        }

        cont.innerHTML = (turnos || []).map((t) => `
          <div class="turno">
            <div class="estado ${t.estado}">${t.estado}</div>
            <div><strong>${t.nombre}</strong></div>
            <div>Tel: ${t.telefono}</div>
            <div>Tipo: ${t.tipos?.nombre || 'Sin tipo'}</div>
            <div>Fecha: ${t.fecha}</div>
            <div>Hora: ${t.hora}</div>
            <div>Notas: ${t.notas || 'Sin notas'}</div>
            <div class="botones">
              <button onclick="cambiarEstado(${t.id}, 'pendiente')">Pendiente</button>
              <button onclick="cambiarEstado(${t.id}, 'confirmado')">Confirmado</button>
              <button onclick="cambiarEstado(${t.id}, 'cancelado')">Cancelado</button>
            </div>
          </div>
        `).join('');
      }

      window.cambiarEstado = async function (id, estado) {
        const client = window.auraSupabase;
        if (!client) return;

        const { error } = await client.from('turnos').update({ estado }).eq('id', id);
        if (!error) {
          await cargarTurnos();
        }
      };

      cargarTurnos();
    </script>
  </body>
</html>
