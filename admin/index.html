<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Aura Nails</title>
    <style>
      body {
        margin: 0;
        background: #fdf2f7;
        font-family: Arial, sans-serif;
      }
      .layout {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: 100vh;
      }
      .sidebar {
        background: #4d2a37;
        color: white;
        padding: 20px;
      }
      .sidebar h2 {
        margin-top: 0;
      }
      .sidebar a {
        display: block;
        color: white;
        text-decoration: none;
        padding: 12px 10px;
        border-radius: 10px;
        margin: 8px 0;
        background: rgba(255,255,255,0.06);
      }
      .main {
        padding: 28px;
      }
      .panel {
        background: white;
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 12px 24px rgba(0,0,0,0.05);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 16px;
        margin-top: 20px;
      }
      .stat {
        background: #fff6fa;
        border-radius: 14px;
        padding: 18px;
        border: 1px solid #f0d5df;
      }
      .stat strong {
        display: block;
        color: #684555;
        margin-bottom: 10px;
      }
      .stat span {
        font-size: 1.8rem;
        font-weight: 700;
        color: #4d2a37;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h2>Aura Nails</h2>
        <a href="index.html">Inicio</a>
        <a href="turnos.html">Turnos</a>
        <a href="clientes.html">Clientes</a>
        <a href="tipos.html">Tipos</a>
        <a href="historial.html">Historial</a>
        <a href="login.html" id="logoutBtn">Cerrar sesión</a>
      </aside>

      <main class="main">
        <div class="panel">
          <h1>Resumen</h1>
          <div class="stats">
            <div class="stat">
              <strong>Tipos</strong>
              <span id="countTipos">0</span>
            </div>
            <div class="stat">
              <strong>Turnos hoy</strong>
              <span id="countHoy">0</span>
            </div>
            <div class="stat">
              <strong>Pendientes</strong>
              <span id="countPendientes">0</span>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="../assets/js/supabase-config.js"></script>
    <script>
      const adminLogged = localStorage.getItem('adminSession');
      if (adminLogged !== 'true') {
        window.location.href = 'login.html';
      }

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('adminSession');
      });

      async function cargarResumen() {
        const client = window.auraSupabase;
        if (!client) {
          document.getElementById('countTipos').textContent = '0';
          document.getElementById('countHoy').textContent = '0';
          document.getElementById('countPendientes').textContent = '0';
          return;
        }

        const hoy = new Date().toISOString().slice(0, 10);
        const { data: tipos = [], error: errorTipos } = await client.from('tipos').select('*');
        const { data: turnos = [], error: errorTurnos } = await client.from('turnos').select('*');

        if (!errorTipos && !errorTurnos) {
          document.getElementById('countTipos').textContent = tipos.length;
          document.getElementById('countHoy').textContent = turnos.filter(t => t.fecha === hoy).length;
          document.getElementById('countPendientes').textContent = turnos.filter(t => t.estado === 'pendiente').length;
        }
      }

      cargarResumen();
    </script>
  </body>
</html>
