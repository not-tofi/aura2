<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7d6de" />
    <meta name="description" content="Panel administrativo de Aura Nails." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aura Admin" />
    <link rel="manifest" href="../manifest.json" />
    <title>Admin - Aura Nails</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <style>
      .panel { background: rgba(255,255,255,0.82); border-radius: 24px; padding: 22px; box-shadow: 0 10px 28px rgba(120,88,75,0.08); }
      .stats { display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 16px; margin-top: 20px; }
      .stat { background: #fff6fa; border-radius: 14px; padding: 18px; border: 1px solid #f0d5df; }
      .stat strong { display: block; color: #684555; margin-bottom: 10px; }
      .stat span { font-size: 1.8rem; font-weight: 700; color: #4d2a37; }
      @media (max-width: 760px) {
        .stats { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <button class="btn-opciones" type="button" aria-expanded="false" aria-label="Abrir menú">
      <span class="logoo" aria-hidden="true"></span>
      <p>menu</p>
    </button>

    <nav class="menu-lateral" id="menu-lateral" aria-hidden="true">
      <div class="menu-header">
        <h3>Aura Nails</h3>
        <button class="menu-cerrar" type="button" aria-label="Cerrar menú">×</button>
      </div>
      <div class="menu-nav">
        <a href="index.html">Inicio</a>
        <a href="turnos.html">Turnos</a>
        <a href="clientes.html">Clientes</a>
        <a href="tipos.html">Tipos</a>
        <a href="historial.html">Historial</a>
        <a href="login.html" id="logoutBtn">Cerrar sesión</a>
      </div>
    </nav>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">✦</div>
          <div>
            <h1>Aura Nails</h1>
            <p>Panel administrativo</p>
          </div>
        </div>
        <nav class="main-nav">
          <a href="index.html" class="active">Inicio</a>
          <a href="turnos.html">Turnos</a>
          <a href="clientes.html">Clientes</a>
          <a href="tipos.html">Tipos</a>
          <a href="historial.html">Historial</a>
        </nav>
      </header>

      <main class="content">
        <div class="panel">
          <h1>Resumen</h1>
          <div class="stats">
            <div class="stat">
              <strong>Tipos</strong>
              <span id="countTipos">0</span>
            </div>
            <div class="stat">
              <strong>Turnos hoy</strong>
              <span id="countHoy">0</span>
            </div>
            <div class="stat">
              <strong>Pendientes</strong>
              <span id="countPendientes">0</span>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        const swUrl = window.location.hostname === 'localhost' ? '../sw.js' : '/aura2/sw.js';
        window.addEventListener('load', () => {
          navigator.serviceWorker.register(swUrl).catch(() => {});
        });
      }

      async function verificarAccesoAdmin() {
        if (!window.AURA_SUPABASE) {
          window.location.href = 'login.html';
          return;
        }

        await window.AURA_SUPABASE.ensureAdminAccess();
      }

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        localStorage.removeItem('adminSession');
        if (window.auraSupabase) {
          await window.auraSupabase.auth.signOut().catch(() => {});
        }
        window.location.href = 'login.html';
      });

      const menuBtn = document.querySelector('.btn-opciones');
      const menuLateral = document.getElementById('menu-lateral');
      const menuCerrar = document.querySelector('.menu-cerrar');

      const toggleMenu = (isOpen) => {
        if (!menuBtn || !menuLateral) return;
        menuLateral.classList.toggle('open', isOpen);
        menuBtn.setAttribute('aria-expanded', String(isOpen));
        menuLateral.setAttribute('aria-hidden', String(!isOpen));
      };

      menuBtn?.addEventListener('click', () => {
        const isOpen = menuLateral.classList.contains('open');
        toggleMenu(!isOpen);
      });

      menuCerrar?.addEventListener('click', () => toggleMenu(false));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') toggleMenu(false);
      });

      verificarAccesoAdmin();

      async function cargarResumen() {
        const client = window.auraSupabase;
        if (!client) {
          document.getElementById('countTipos').textContent = '0';
          document.getElementById('countHoy').textContent = '0';
          document.getElementById('countPendientes').textContent = '0';
          return;
        }

        const hoy = new Date().toISOString().slice(0, 10);
        const { data: tipos = [], error: errorTipos } = await client.from('tipos').select('*');
        const { data: turnos = [], error: errorTurnos } = await client.from('turnos').select('*');

        if (!errorTipos && !errorTurnos) {
          document.getElementById('countTipos').textContent = tipos.length;
          document.getElementById('countHoy').textContent = turnos.filter(t => t.fecha === hoy).length;
          document.getElementById('countPendientes').textContent = turnos.filter(t => t.estado === 'pendiente').length;
        }
      }

      cargarResumen();
    </script>
  </body>
</html>
