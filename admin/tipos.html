<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tipos - Admin</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <style>
      .panel { background: rgba(255,255,255,0.82); border-radius: 24px; padding: 22px; box-shadow: 0 10px 28px rgba(120,88,75,0.08); }
      .tipo { border: 1px solid #f0dfe7; border-radius: 12px; padding: 16px; margin-top: 10px; }
      form { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
      input, button { padding: 10px 12px; border-radius: 10px; border: 1px solid #e7c7d5; font-size: 1rem; }
      button { background: #d97ca2; color: white; border: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <button class="btn-opciones" type="button" aria-expanded="false" aria-label="Abrir menú">
      <span class="logoo" aria-hidden="true"></span>
      <p>menu</p>
    </button>

    <nav class="menu-lateral" id="menu-lateral" aria-hidden="true">
      <div class="menu-header">
        <h3>Aura Nails</h3>
        <button class="menu-cerrar" type="button" aria-label="Cerrar menú">×</button>
      </div>
      <div class="menu-nav">
        <a href="index.html">Inicio</a>
        <a href="turnos.html">Turnos</a>
        <a href="clientes.html">Clientes</a>
        <a href="tipos.html">Tipos</a>
        <a href="historial.html">Historial</a>
        <a href="login.html" id="logoutBtn">Cerrar sesión</a>
      </div>
    </nav>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">✦</div>
          <div>
            <h1>Aura Nails</h1>
            <p>Panel administrativo</p>
          </div>
        </div>
        <nav class="main-nav">
          <a href="index.html">Inicio</a>
          <a href="turnos.html">Turnos</a>
          <a href="clientes.html">Clientes</a>
          <a href="tipos.html" class="active">Tipos</a>
          <a href="historial.html">Historial</a>
        </nav>
      </header>

      <main class="content">
        <div class="panel">
          <h1>Tipos de uña</h1>
          <form id="formTipo">
            <input id="nombreTipo" type="text" placeholder="Nombre del tipo" required />
            <input id="precioTipo" type="number" placeholder="Precio" required />
            <button type="submit">Agregar</button>
          </form>
          <div id="listaTipos"></div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script>
      async function verificarAccesoAdmin() {
        if (!window.AURA_SUPABASE) {
          window.location.href = 'login.html';
          return;
        }

        await window.AURA_SUPABASE.ensureAdminAccess();
      }

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        localStorage.removeItem('adminSession');
        if (window.auraSupabase) {
          await window.auraSupabase.auth.signOut().catch(() => {});
        }
        window.location.href = 'login.html';
      });

      const menuBtn = document.querySelector('.btn-opciones');
      const menuLateral = document.getElementById('menu-lateral');
      const menuCerrar = document.querySelector('.menu-cerrar');

      const toggleMenu = (isOpen) => {
        if (!menuBtn || !menuLateral) return;
        menuLateral.classList.toggle('open', isOpen);
        menuBtn.setAttribute('aria-expanded', String(isOpen));
        menuLateral.setAttribute('aria-hidden', String(!isOpen));
      };

      menuBtn?.addEventListener('click', () => {
        const isOpen = menuLateral.classList.contains('open');
        toggleMenu(!isOpen);
      });

      menuCerrar?.addEventListener('click', () => toggleMenu(false));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') toggleMenu(false);
      });

      verificarAccesoAdmin();

      async function renderTipos() {
        const client = window.auraSupabase;
        const cont = document.getElementById('listaTipos');

        if (!client) {
          cont.innerHTML = '<p>Configura Supabase para ver los tipos.</p>';
          return;
        }

        const { data, error } = await client.from('tipos').select('*').order('nombre');

        if (error) {
          cont.innerHTML = '<p>No se pudieron cargar los tipos.</p>';
          return;
        }

        cont.innerHTML = (data || []).map((tipo) => `
          <div class="tipo">
            <strong>${tipo.nombre}</strong><br>
            Precio: $${Number(tipo.precio).toFixed(2)}
          </div>
        `).join('');
      }

      document.getElementById('formTipo').addEventListener('submit', async (e) => {
        e.preventDefault();

        const client = window.auraSupabase;
        if (!client) {
          return;
        }

        const nombre = document.getElementById('nombreTipo').value.trim();
        const precio = Number(document.getElementById('precioTipo').value);

        if (!nombre || !precio) return;

        const { error } = await client.from('tipos').insert([{ nombre, precio }]);

        if (!error) {
          document.getElementById('formTipo').reset();
          await renderTipos();
        }
      });

      renderTipos();
    </script>
  </body>
</html>
