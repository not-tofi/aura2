<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes - Admin</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <style>
      .panel { background: rgba(255,255,255,0.82); border-radius: 24px; padding: 22px; box-shadow: 0 10px 28px rgba(120,88,75,0.08); }
      .cliente { border: 1px solid #f0dfe7; border-radius: 12px; padding: 16px; margin-top: 10px; }
      @media (max-width: 480px) {
        .panel { padding: 16px 14px; }
      }
    </style>
  </head>
  <body>
    <button class="btn-opciones" type="button" aria-expanded="false" aria-label="Abrir menú">
      <span class="logoo" aria-hidden="true"></span>
      <p>menu</p>
    </button>

    <nav class="menu-lateral" id="menu-lateral" aria-hidden="true">
      <div class="menu-header">
        <h3>Aura Nails</h3>
        <button class="menu-cerrar" type="button" aria-label="Cerrar menú">×</button>
      </div>
      <div class="menu-nav">
        <a href="index.html">Inicio</a>
        <a href="turnos.html">Turnos</a>
        <a href="clientes.html">Clientes</a>
        <a href="tipos.html">Tipos</a>
        <a href="historial.html">Historial</a>
        <a href="login.html" id="logoutBtn">Cerrar sesión</a>
      </div>
    </nav>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">✦</div>
          <div>
            <h1>Aura Nails</h1>
            <p>Panel administrativo</p>
          </div>
        </div>
        <nav class="main-nav">
          <a href="index.html">Inicio</a>
          <a href="turnos.html">Turnos</a>
          <a href="clientes.html" class="active">Clientes</a>
          <a href="tipos.html">Tipos</a>
          <a href="historial.html">Historial</a>
        </nav>
      </header>

      <main class="content">
        <div class="panel">
          <h1>Clientes</h1>
          <div id="listaClientes"></div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script>
      async function verificarAccesoAdmin() {
        if (!window.AURA_SUPABASE) {
          window.location.href = 'login.html';
          return;
        }

        await window.AURA_SUPABASE.ensureAdminAccess();
      }

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        localStorage.removeItem('adminSession');
        if (window.auraSupabase) {
          await window.auraSupabase.auth.signOut().catch(() => {});
        }
        window.location.href = 'login.html';
      });

      const menuBtn = document.querySelector('.btn-opciones');
      const menuLateral = document.getElementById('menu-lateral');
      const menuCerrar = document.querySelector('.menu-cerrar');

      const toggleMenu = (isOpen) => {
        if (!menuBtn || !menuLateral) return;
        menuLateral.classList.toggle('open', isOpen);
        menuBtn.setAttribute('aria-expanded', String(isOpen));
        menuLateral.setAttribute('aria-hidden', String(!isOpen));
      };

      menuBtn?.addEventListener('click', () => {
        const isOpen = menuLateral.classList.contains('open');
        toggleMenu(!isOpen);
      });

      menuCerrar?.addEventListener('click', () => toggleMenu(false));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') toggleMenu(false);
      });

      verificarAccesoAdmin();

      async function cargarClientes() {
        const contenedor = document.getElementById('listaClientes');
        const client = window.auraSupabase;

        if (!client) {
          contenedor.innerHTML = '<p>Falta configurar Supabase.</p>';
          return;
        }

        const { data, error } = await client
          .from('turnos')
          .select('id, nombre, telefono, fecha, estado, tipo_id, tipos (id, nombre)')
          .order('fecha', { ascending: false });

        if (error) {
          contenedor.innerHTML = '<p>No se pudieron cargar los clientes.</p>';
          return;
        }

        const clientesUnicos = new Map();

        (data || []).forEach((turno) => {
          const key = turno.telefono || turno.nombre;
          if (!clientesUnicos.has(key)) {
            clientesUnicos.set(key, {
              nombre: turno.nombre,
              telefono: turno.telefono,
              tipo: turno.tipos?.nombre || 'Sin tipo',
              fecha: turno.fecha,
              estado: turno.estado
            });
          }
        });

        const clientes = [...clientesUnicos.values()];

        if (!clientes.length) {
          contenedor.innerHTML = '<p>No hay clientes registrados todavía.</p>';
          return;
        }

        contenedor.innerHTML = clientes.map((c) => `
          <div class="cliente">
            <strong>${c.nombre}</strong><br>
            Tel: ${c.telefono}<br>
            Tipo: ${c.tipo}<br>
            Próximo turno: ${c.fecha}<br>
            Estado: ${c.estado}
          </div>
        `).join('');
      }

      cargarClientes();
    </script>
  </body>
</html>
