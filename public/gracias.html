<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turno confirmado - Aura Nails</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #fff7fa, #f7dfe8);
        font-family: Arial, sans-serif;
        color: #3d2a35;
      }
      .card {
        width: min(520px, 90vw);
        background: white;
        border-radius: 20px;
        padding: 36px 28px;
        box-shadow: 0 18px 42px rgba(117, 69, 88, 0.14);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        color: #4d2a37;
      }
      p {
        margin: 0 0 22px;
        color: #6d5360;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 12px;
        background: #d97ca2;
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>¡Turno enviado!</h1>
      <p>Gracias por reservar con nosotros. El equipo de Aura Nails va a revisar tu solicitud y te va a confirmar por teléfono.</p>
      <a href="./reservar.html">Reservar otro turno</a>
    </div>
  </body>
</html>
