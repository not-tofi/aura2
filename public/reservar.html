<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservar turno - Aura Nails</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fff6fa;
        color: #3d2a35;
      }
      .wrap {
        max-width: 760px;
        margin: 40px auto;
        padding: 24px;
      }
      .card {
        background: white;
        border-radius: 20px;
        padding: 26px;
        box-shadow: 0 18px 42px rgba(117, 69, 88, 0.12);
      }
      h1 {
        margin: 0 0 8px;
        color: #4d2a37;
        text-align: center;
      }
      .sub {
        margin: 0 0 22px;
        text-align: center;
        color: #6d5360;
      }
      label {
        display: block;
        margin: 14px 0 8px;
        font-weight: 700;
      }
      input, select, textarea, button {
        width: 100%;
        border-radius: 12px;
        border: 1px solid #ebc8d4;
        padding: 12px 14px;
        font-size: 1rem;
      }
      textarea {
        resize: vertical;
        min-height: 100px;
      }
      button {
        margin-top: 18px;
        background: #d97ca2;
        border: none;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      .success {
        display: none;
        margin-top: 22px;
        padding: 18px;
        background: #eefaf1;
        border: 1px solid #b7e6c2;
        border-radius: 12px;
        color: #1c5d35;
        font-weight: 600;
      }
      .success.visible {
        display: block;
      }
      .error {
        min-height: 20px;
        margin-top: 12px;
        color: #9a2347;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Reservá tu turno</h1>
        <p class="sub">Elegí el servicio, la fecha y el horario disponible.</p>

        <form id="formTurno">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" required />

          <label for="telefono">Teléfono</label>
          <input id="telefono" type="tel" required />

          <label for="tipo">Tipo de uña</label>
          <select id="tipo" required></select>

          <label for="fecha">Fecha</label>
          <input id="fecha" type="date" required />

          <label for="hora">Horario</label>
          <select id="hora" required>
            <option value="">Elegí un horario</option>
          </select>

          <label for="notas">Notas (opcional)</label>
          <textarea id="notas" rows="3"></textarea>

          <button type="submit">Enviar</button>
        </form>

        <div id="error" class="error"></div>
        <div id="success" class="success">¡Turno enviado correctamente! Te confirmaremos por teléfono.</div>
      </div>
    </div>

    <script>
      const tipos = [
        { id: 1, nombre: 'Uñas XL', precio: 2500 },
        { id: 2, nombre: 'Kapping', precio: 3200 },
        { id: 3, nombre: 'Soft Gel', precio: 2800 },
        { id: 4, nombre: 'French', precio: 3000 }
      ];

      const horarios = ['09:00', '11:00', '13:00', '15:00', '17:00', '19:00'];
      const ocupado = ['11:00', '15:00'];

      const tipoSelect = document.getElementById('tipo');
      const fechaInput = document.getElementById('fecha');
      const horaSelect = document.getElementById('hora');
      const form = document.getElementById('formTurno');
      const errorBox = document.getElementById('error');
      const successBox = document.getElementById('success');

      function setFechaMinima() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        fechaInput.min = `${yyyy}-${mm}-${dd}`;
        fechaInput.value = `${yyyy}-${mm}-${dd}`;
      }

      function cargarTipos() {
        tipoSelect.innerHTML = '<option value="">Elegí una opción</option>';
        tipos.forEach((tipo) => {
          const option = document.createElement('option');
          option.value = tipo.id;
          option.textContent = `${tipo.nombre} - $${tipo.precio}`;
          tipoSelect.appendChild(option);
        });
      }

      function cargarHorarios() {
        const fecha = fechaInput.value;
        horaSelect.innerHTML = '<option value="">Elegí un horario</option>';

        if (!fecha) return;

        const disponibles = horarios.filter((h) => !ocupado.includes(h));

        if (disponibles.length === 0) {
          const option = document.createElement('option');
          option.value = '';
          option.textContent = 'Sin disponibilidad';
          horaSelect.appendChild(option);
          horaSelect.disabled = true;
          return;
        }

        disponibles.forEach((h) => {
          const option = document.createElement('option');
          option.value = h;
          option.textContent = h + ' hs';
          horaSelect.appendChild(option);
        });

        horaSelect.disabled = false;
      }

      fechaInput.addEventListener('change', cargarHorarios);
      setFechaMinima();
      cargarTipos();
      cargarHorarios();

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.textContent = '';
        successBox.classList.remove('visible');

        const payload = {
          nombre: document.getElementById('nombre').value.trim(),
          telefono: document.getElementById('telefono').value.trim(),
          tipoId: Number(tipoSelect.value),
          fecha: fechaInput.value,
          hora: horaSelect.value,
          notas: document.getElementById('notas').value.trim(),
          estado: 'pendiente'
        };

        if (!payload.nombre || !payload.telefono || !payload.tipoId || !payload.fecha || !payload.hora) {
          errorBox.textContent = 'Completá todos los campos obligatorios.';
          return;
        }

        try {
          const response = await fetch('https://jsonplaceholder.typicode.com/posts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error('No se pudo enviar');
          }

          successBox.classList.add('visible');
          form.reset();
          setFechaMinima();
          cargarHorarios();
        } catch (error) {
          errorBox.textContent = 'Hubo un error al enviar el turno. Intentá nuevamente.';
        }
      });
    </script>
  </body>
</html>
