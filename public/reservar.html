<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7d6de" />
    <meta name="description" content="Reservá tu turno en Aura Nails desde tu navegador o como app." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aura Nails" />
    <link rel="manifest" href="../manifest.json" />
    <title>Reservar turno - Aura Nails</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fff6fa;
        color: #3d2a35;
      }
      .wrap {
        max-width: 760px;
        margin: 40px auto;
        padding: 24px;
      }
      .card {
        background: white;
        border-radius: 20px;
        padding: 26px;
        box-shadow: 0 18px 42px rgba(117, 69, 88, 0.12);
      }
      h1 {
        margin: 0 0 8px;
        color: #4d2a37;
        text-align: center;
      }
      .sub {
        margin: 0 0 22px;
        text-align: center;
        color: #6d5360;
      }
      label {
        display: block;
        margin: 14px 0 8px;
        font-weight: 700;
      }
      input, select, textarea, button {
        width: 100%;
        border-radius: 12px;
        border: 1px solid #ebc8d4;
        padding: 12px 14px;
        font-size: 1rem;
      }
      textarea {
        resize: vertical;
        min-height: 100px;
      }
      button {
        margin-top: 18px;
        background: #d97ca2;
        border: none;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      .success {
        display: none;
        margin-top: 22px;
        padding: 18px;
        background: #eefaf1;
        border: 1px solid #b7e6c2;
        border-radius: 12px;
        color: #1c5d35;
        font-weight: 600;
      }
      .success.visible {
        display: block;
      }
      .error {
        min-height: 20px;
        margin-top: 12px;
        color: #9a2347;
        font-weight: 700;
      }
      .install-btn {
        display: none;
        width: 100%;
        margin-top: 18px;
        background: #4d2a37;
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      .install-btn.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Reservá tu turno</h1>
        <p class="sub">Elegí el servicio, la fecha y el horario disponible.</p>

        <form id="formTurno">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" required />

          <label for="telefono">Teléfono</label>
          <input id="telefono" type="tel" required />

          <label for="tipo">Tipo de uña</label>
          <select id="tipo" required></select>

          <label for="fecha">Fecha</label>
          <input id="fecha" type="date" required />

          <label for="hora">Horario</label>
          <select id="hora" required>
            <option value="">Elegí un horario</option>
          </select>

          <label for="notas">Notas (opcional)</label>
          <textarea id="notas" rows="3"></textarea>

          <button type="submit">Enviar</button>
          <button id="installButton" class="install-btn" type="button">Instalar app</button>
        </form>

        <div id="error" class="error"></div>
        <div id="success" class="success">¡Turno enviado correctamente! Te confirmaremos por teléfono.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script>
      const installButton = document.getElementById('installButton');
      let deferredPrompt = null;

      if ('serviceWorker' in navigator) {
        const swUrl = '../sw.js';
        window.addEventListener('load', () => {
          navigator.serviceWorker.register(swUrl).catch((error) => {
            console.warn('Service worker no pudo registrarse:', error);
          });
        });
      }

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredPrompt = event;
        installButton.classList.add('visible');
      });

      installButton.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installButton.classList.remove('visible');
      });
      const tipoSelect = document.getElementById('tipo');
      const fechaInput = document.getElementById('fecha');
      const horaSelect = document.getElementById('hora');
      const form = document.getElementById('formTurno');
      const errorBox = document.getElementById('error');
      const successBox = document.getElementById('success');

      const horarios = ['09:00', '11:00', '13:00', '15:00', '17:00', '19:00'];

      function setFechaMinima() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        fechaInput.min = `${yyyy}-${mm}-${dd}`;
        fechaInput.value = `${yyyy}-${mm}-${dd}`;
      }

      async function cargarTipos() {
        const client = window.auraSupabase;
        if (!client) {
          tipoSelect.innerHTML = '<option value="">Configura Supabase</option>';
          return;
        }

        const { data, error } = await client.from('tipos').select('*').order('nombre');

        if (error) {
          tipoSelect.innerHTML = '<option value="">No se pudieron cargar los tipos</option>';
          return;
        }

        tipoSelect.innerHTML = '<option value="">Elegí una opción</option>';
        data.forEach((tipo) => {
          const option = document.createElement('option');
          option.value = tipo.id;
          option.textContent = `${tipo.nombre} - $${Number(tipo.precio).toFixed(2)}`;
          tipoSelect.appendChild(option);
        });
      }

      async function cargarHorariosDisponibles() {
        const fecha = fechaInput.value;
        horaSelect.innerHTML = '<option value="">Elegí un horario</option>';
        horaSelect.disabled = true;

        if (!fecha || !window.auraSupabase) return;

        const { data, error } = await window.auraSupabase
          .from('turnos')
          .select('hora')
          .eq('fecha', fecha);

        if (error) {
          horaSelect.innerHTML = '<option value="">Error al cargar horarios</option>';
          return;
        }

        const ocupados = new Set((data || []).map((turno) => turno.hora));
        const libres = horarios.filter((hora) => !ocupados.has(hora));

        if (libres.length === 0) {
          const option = document.createElement('option');
          option.value = '';
          option.textContent = 'Sin disponibilidad';
          horaSelect.appendChild(option);
          return;
        }

        libres.forEach((hora) => {
          const option = document.createElement('option');
          option.value = hora;
          option.textContent = `${hora} hs`;
          horaSelect.appendChild(option);
        });

        horaSelect.disabled = false;
      }

      fechaInput.addEventListener('change', cargarHorariosDisponibles);
      setFechaMinima();
      cargarTipos();
      cargarHorariosDisponibles();

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.textContent = '';
        successBox.classList.remove('visible');

        if (!window.auraSupabase) {
          errorBox.textContent = 'Falta configurar Supabase en el proyecto.';
          return;
        }

        const payload = {
          nombre: document.getElementById('nombre').value.trim(),
          telefono: document.getElementById('telefono').value.trim(),
          tipo_id: Number(tipoSelect.value),
          fecha: fechaInput.value,
          hora: horaSelect.value,
          notas: document.getElementById('notas').value.trim(),
          estado: 'pendiente'
        };

        if (!payload.nombre || !payload.telefono || !payload.tipo_id || !payload.fecha || !payload.hora) {
          errorBox.textContent = 'Completá todos los campos obligatorios.';
          return;
        }

        try {
          const { error } = await window.auraSupabase.from('turnos').insert([payload]);

          if (error) {
            throw error;
          }

          form.reset();
          setFechaMinima();
          await cargarTipos();
          await cargarHorariosDisponibles();
          window.location.href = './gracias.html';
        } catch (error) {
          console.error(error);
          errorBox.textContent = 'Hubo un error al enviar el turno. Revisá la configuración de Supabase.';
        }
      });
    </script>
  </body>
</html>
